<script>
(function(){
'use strict';
const HOOK={};

const css=getComputedStyle(document.documentElement);

function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h)}
function txt(c,s,x,y,size,col,align,weight){c.font=`${weight||700} ${size}px ${FONT}`;c.fillStyle=col;c.textAlign=align||'center';c.textBaseline='middle';c.fillText(s,x,y)}
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function pill(c,s,x,y,size,bg,fg){c.font=`700 ${size}px ${FONT}`;const w=c.measureText(s).width+24;rr(c,x-w/2,y-size,w,size*2,size);c.fillStyle=bg;c.fill();txt(c,s,x,y,size,fg)}
function bubble(c,s,x,y){c.font=`700 15px ${FONT}`;const w=c.measureText(s).width+20;const bx=clamp(x-w/2,6,W-w-6);const ty=Math.max(y,40);rr(c,bx,ty-32,w,28,8);c.fillStyle=C.fg;c.fill();const tx=clamp(x,bx+12,bx+w-12);c.beginPath();c.moveTo(tx-6,ty-5);c.lineTo(tx+6,ty-5);c.lineTo(tx,ty+3);c.closePath();c.fill();txt(c,s,bx+w/2,ty-18,15,C.bg)}
function overlay(c,title,lines){c.fillStyle='rgba(12,17,28,0.8)';c.fillRect(0,0,W,H);txt(c,title,W/2,H/2-70,46,C.fg,'center',800);lines.forEach((l,i)=>txt(c,l,W/2,H/2-10+i*36,i===lines.length-1?18:22,i===lines.length-1?C.sun:C.muted,'center',i===lines.length-1?700:600))}
function makeFX(){return{parts:[],shake:0,
  burst(x,y,col,n,sp){n=n||12;sp=sp||200;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=sp*(0.3+Math.random()*0.8);this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:0.5+Math.random()*0.4,col,sz:3+Math.random()*4})}},
  update(dt){this.shake=Math.max(0,this.shake-dt*30);for(const p of this.parts){p.life-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}this.parts=this.parts.filter(p=>p.life>0)},
  draw(c){for(const p of this.parts){c.globalAlpha=clamp(p.life*2,0,1);c.fillStyle=p.col;c.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz)}c.globalAlpha=1},
  apply(c){if(this.shake>0)c.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake)}}}
function stepPops(S,dt){for(const p of S.pops){p.life-=dt;p.y-=28*dt}S.pops=S.pops.filter(p=>p.life>0);if(S.msgT>0)S.msgT-=dt}
function drawPops(c,S){for(const p of S.pops){c.globalAlpha=clamp(p.life,0,1);txt(c,p.s,p.x,p.y,18,p.col,'center',800)}c.globalAlpha=1}

/* best scores: localStorage when allowed, memory otherwise */
const memBest={};
function getBest(k){let v=0;try{v=Number(localStorage.getItem('proto3_best_'+k))||0}catch(e){}return Math.max(v,memBest[k]||0)}
function saveBest(k,v){if(v>getBest(k)){memBest[k]=v;try{localStorage.setItem('proto3_best_'+k,String(v))}catch(e){}}updateBest()}

/* ====================== A. 坑勇者（第三版：抽卡 + 流派 + 解锁） ====================== */
function TrapGame(){
  const CMP=(typeof COMPACT!=='undefined'&&COMPACT)||H<500,BAR=H-(CMP?74:64),FLOOR=BAR-(CMP?40:44),CEIL=CMP?46:112,K=CMP?clamp((FLOOR-CEIL)/190,1.4,2.0):1,WW=W/K,WCEIL=FLOOR-(FLOOR-CEIL)/K,WBAR=FLOOR+(BAR-FLOOR)/K,T0=48,TS=48,NT=Math.floor((WW-96)/TS),EXIT=WW-42,SPD=CMP?WW/W:1;

    spike:{name:'地刺',cost:10,up:0,uses:3,sch:'spike',desc:'踩上去就死'},
    pit:{name:'翻板',cost:14,up:0,uses:2,sch:'fall',desc:'踩上去掉下去'},
    chest:{name:'诱饵箱',cost:4,up:0,uses:1,sch:'heavy',desc:'勇者会停下来开箱，配合别的陷阱用'},
    arrow:{name:'暗箭',cost:18,up:1,uses:3,sch:'mech',desc:'挂在墙上，定时射箭'},
    rock:{name:'落石',cost:8,up:1,uses:1,sch:'heavy',desc:'勇者走到下面时砸下来'},
    boulder:{name:'滚石',cost:12,up:1,uses:1,sch:'heavy',desc:'勇者走过后放出，往回滚砸一串'},
    spring:{name:'弹簧板',cost:12,up:0,uses:4,sch:'spike',desc:'把勇者弹到天花板上'},
    ceil:{name:'顶刺',cost:8,up:1,uses:4,sch:'spike',desc:'天花板尖刺，配合弹簧板'},
    ice:{name:'冰面',cost:8,up:0,uses:6,sch:'fall',desc:'勇者打滑，停不下也跳不起来'},
    flame:{name:'火焰喷口',cost:14,up:1,uses:4,sch:'mech',desc:'一阵一阵喷火'},
    portal:{name:'传送门',cost:16,up:0,uses:3,sch:'fall',desc:'把勇者送回入口重走一遍，每人只会被送一次'},
    gas:{name:'毒雾',cost:16,up:1,uses:3,sch:'mech',desc:'在雾里待太久会中毒死'}
  };
  const ALL=Object.keys(TD);
  const FLOORT={spike:1,pit:1,ice:1,spring:1,portal:1};
  const RANGE={arrow:340,rock:160,boulder:420,flame:170,gas:220};
  const UPG={
    spike_dur:{trap:'spike',name:'加固地刺',desc:'地刺耐久 +2'},
    pit_dur:{trap:'pit',name:'加固翻板',desc:'翻板耐久 +2'},
    chest_long:{trap:'chest',name:'沉重宝箱',desc:'勇者开箱时间翻倍'},
    arrow_double:{trap:'arrow',name:'双发暗箭',desc:'多射一支低箭，蹲下躲不掉'},
    rock_roll:{trap:'rock',name:'滚落',desc:'落石落地后会往回滚'},
    boulder_big:{trap:'boulder',name:'巨型滚石',desc:'大到跳不过去'},
    spring_back:{trap:'spring',name:'斜弹',desc:'把勇者往回弹两三格'},
    ceil_dur:{trap:'ceil',name:'加长顶刺',desc:'顶刺耐久 +3'},
    ice_long:{trap:'ice',name:'镜面冰',desc:'滑得更快、更久'},
    flame_long:{trap:'flame',name:'猛火',desc:'每次喷火时间更长'},
    portal_dur:{trap:'portal',name:'稳定传送门',desc:'传送门耐久 +3'},
    gas_wide:{trap:'gas',name:'浓毒雾',desc:'毒雾范围从 3 格扩大到 5 格'}
  };
  const GEN={gold:{name:'意外之财',desc:'立刻获得 40 金币'},life:{name:'加固大门',desc:'还能放走的人数 +1'},cap:{name:'扩建地牢',desc:'陷阱总数上限 +2'}};
  const DET=[0,0.45,0.75,0.9];
  const CLS={
    rookie:{name:'新手',spd:125,hp:1,gold:7,w:22,h:34,body:C.sun,info:'普通勇者'},
    knight:{name:'盾骑士',spd:100,hp:1,gold:10,w:24,h:36,body:C.muted,info:'举着盾，暗箭射不死他'},
    thief:{name:'盗贼',spd:165,hp:1,gold:10,w:18,h:32,body:C.mint,info:'跑得快，更容易发现地上的陷阱'},
    brute:{name:'重甲兵',spd:92,hp:2,gold:13,w:30,h:40,body:C.stone,info:'皮厚，能多扛一下（翻板除外）'},
    sapper:{name:'工兵',spd:110,hp:1,gold:11,w:22,h:34,body:C.copper,info:'会拆掉他认出的地上陷阱'},
    priest:{name:'牧师',spd:100,hp:1,gold:12,w:22,h:36,body:C.fg,info:'能把刚倒下的同伴救起来一次'},
    scout:{name:'斥候',spd:150,hp:1,gold:11,w:20,h:32,body:C.sky,info:'他认出的陷阱，全队都会知道'},
    boss:{name:'勇者王',spd:105,hp:4,gold:40,w:34,h:46,body:C.sun,info:'血厚，要连着坑好几次；放走他扣好几条命'}
  };
  const AFX={fast:'急行军：速度 +25%',armor:'铁甲：每人多扛一下',intel:'情报精通：都更会认陷阱',horde:'人海：多来 3 个人'};
  const DEATH={spike:'脚好痛…告诉大家地上有刺！',pit:'地板是假的！快告诉公会！',arrow:'暗箭伤人…',rock:'头顶有石头…',chest:'宝箱是诱饵…',boulder:'哪来的大石头！',ceil:'天花板上有刺！',flame:'好烫好烫！',gas:'这雾有毒…',ice:'刹不住啊！',portal:'怎么又回来了…',spring:'飞太高了！'};
  const DODGE=['公会说过这招！','早看穿了！','学过了～','想骗我？没门。','情报里有这个。'];
  const ESC=['就这？我还会回来的！','地牢太简单了！','下次带着经验回来！'];
  const GOALS=[
    {id:'arrow',text:'一局里用地刺坑死 10 人',p:()=>[S.run.spikeKills,10]},
    {id:'rock',text:'在勇者开箱时坑死他，累计 3 次',p:()=>[M.chestKills,3]},
    {id:'boulder',text:'守住第 5 波',p:()=>[M.best,5]},
    {id:'spring',text:'一个陷阱同时坑死 2 人',p:()=>[M.multi,1]},
    {id:'ice',text:'一局里连续 3 波一个都不放走',p:()=>[S.run.streak,3]},
    {id:'ceil',text:'让勇者撞到天花板，累计 5 次',p:()=>[M.bonks,5]},
    {id:'flame',text:'坑死盾骑士，累计 5 个',p:()=>[M.knightKills,5]},
    {id:'portal',text:'坑死老兵，累计 3 个',p:()=>[M.vetKills,3]},
    {id:'gas',text:'守住第 10 波',p:()=>[M.best,10]}
  ];
  const META_KEY='kyz_meta_v1';let memMeta=null;
  function loadMeta(){let m=null;try{m=JSON.parse(localStorage.getItem(META_KEY)||'null')}catch(e){}m=m||memMeta||{};const d={unlocked:{spike:1,pit:1,chest:1},chestKills:0,knightKills:0,vetKills:0,bonks:0,multi:0,best:0};for(const k in d)if(m[k]==null)m[k]=d[k];return m}
  function saveMeta(){memMeta=M;try{localStorage.setItem(META_KEY,JSON.stringify(M))}catch(e){}}
  let M=loadMeta();
  const g={key:'trap'};let S,uid=0;
  const pop=(s,x,y,col)=>S.pops.push({s,x,y,col:col||C.fg,life:1.6});
  const flash=s=>{S.msg=s;S.msgT=1.6};
  function say(h,text,force){if(!force&&S.talk&&S.talk.t>0.5)return;S.talk={h,text,t:1.8}}
  const tileAt=x=>{const i=Math.floor((x-T0)/TS);return(i>=0&&i<NT)?i:-1};
  const tileX=i=>T0+i*TS+TS/2;
  const alive=h=>!h.dead&&!h.escaped;
  const schoolN=s=>S.owned.filter(k=>TD[k].sch===s).length;
  const active=s=>schoolN(s)>=3;
  const gasHalf=()=>S.upg.gas_wide?TS*2.5:TS*1.5;
  function lvl(h,type){let l=S.intel[type]+Math.floor((S.wave-1)/10)+(S.affix==='intel'?1:0)+(h.cls==='boss'?1:0);if(h.vet)l++;if(h.cls==='thief'&&FLOORT[type])l++;return Math.min(3,l)}
  function maxUses(type){let u=TD[type].uses;
    if(type==='spike'&&S.upg.spike_dur)u+=2;if(type==='pit'&&S.upg.pit_dur)u+=2;if(type==='portal'&&S.upg.portal_dur)u+=3;if(type==='ceil'&&S.upg.ceil_dur)u+=3;
    if(active('spike')&&TD[type].sch==='spike')u+=1;if(active('fall')&&(type==='ice'||type==='portal'))u+=2;return u}
  function flameState(t){let off=1.6;const on=S.upg.flame_long?1.3:0.8;if(active('mech'))off*=0.7;const ph=t.ft%(off+on);return{on:ph>off,toOn:ph>off?0:off-ph}}
  function slotRects(){const n=S.owned.length,gap=8,w=Math.min(164,(W-40-(n-1)*gap)/n),x0=(W-(n*w+(n-1)*gap))/2;return S.owned.map((k,i)=>({k,x:x0+i*(w+gap),y:BAR+7,w,h:CMP?60:50}))}
  const CH=Math.min(250,BAR-CEIL-96);
  const CARD=i=>({x:W/2-395+i*270,y:CEIL+38,w:250,h:CH});
  const RER={x:W/2-120,y:CEIL+48+CH,w:240,h:38};
  const inR=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
  const rerollCost=()=>10+5*S.rerolls;
  const costOf=k=>Math.round(TD[k].cost*(1+0.05*Math.max(0,S.wave-4)));
  function waveComp(n){
    const count=Math.min(12,1+Math.ceil(n*0.9))+(S.nextAffix==='horde'?3:0),list=[];
    for(let i=0;i<count;i++){let cls='rookie';const r=Math.random();
      if(n>=8&&r<0.1)cls='scout';else if(n>=7&&r<0.2)cls='priest';else if(n>=6&&r<0.32)cls='sapper';
      else if(n>=2&&r<0.5)cls='knight';else if(n>=3&&r<0.7)cls='thief';else if(n>=4&&r<0.85)cls='brute';list.push(cls)}
    if(n===2)list[0]='knight';if(n===3)list[0]='thief';if(n===4)list[0]='brute';if(n===6)list[0]='sapper';if(n===7)list[0]='priest';if(n===8)list[0]='scout';
    const vets=S.veterans.filter(c=>c!=='boss').splice(0).map(c=>({cls:c,vet:true}));S.veterans=[];
    const out=vets.concat(list.map(c=>({cls:c,vet:false}))).slice(0,16);
    if(n%5===0)out.push({cls:'boss',vet:false});
    return out;
  }
  g.reset=function(){
    M=loadMeta();
    const others=ALL.filter(k=>M.unlocked[k]&&k!=='spike'&&k!=='ceil');
    S={wave:0,lives:5,gold:50,cap:8,traps:[],arrows:[],balls:[],heroes:[],queue:[],spawnT:0,intel:{},glow:{},waveKills:{},veterans:[],owned:['spike',choice(others)],upg:{},sel:'spike',over:false,t:0,fx:makeFX(),pops:[],msg:'',msgT:0,hover:null,phase:'break',breakT:10,preview:[],seen:{},talk:null,kills:0,announce:null,unlock:null,draft:null,rerolls:0,escThisWave:0,affix:null,nextAffix:null,run:{spikeKills:0,streak:0}};
    for(const k of ALL){S.intel[k]=0;S.glow[k]=0}
    S.preview=waveComp(1);
  };
  function checkUnlocks(){for(const gl of GOALS){if(M.unlocked[gl.id])continue;const[a,b]=gl.p();if(a>=b){M.unlocked[gl.id]=1;saveMeta();S.unlock={text:`解锁新陷阱：${TD[gl.id].name}！之后抽卡会出现它`,t:4.5};S.fx.shake=Math.max(S.fx.shake,6)}}}
  function makeDraft(){
    const pool=[];
    if(S.owned.length<8)ALL.filter(k=>M.unlocked[k]&&!S.owned.includes(k)).forEach(k=>pool.push({kind:'trap',id:k,w:3}));
    Object.keys(UPG).filter(u=>S.owned.includes(UPG[u].trap)&&!S.upg[u]).forEach(u=>pool.push({kind:'upg',id:u,w:2}));
    pool.push({kind:'gen',id:'gold',w:1});if(S.lives<7)pool.push({kind:'gen',id:'life',w:1});if(S.cap<14)pool.push({kind:'gen',id:'cap',w:1});
    const out=[];
    while(out.length<3&&pool.length){let sum=0;for(const p of pool)sum+=p.w;let r=Math.random()*sum,i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(i,1)[0])}
    return out;
  }
  function pickCard(cd){
    const before=Object.keys(SCH).filter(active);
    if(cd.kind==='trap'){S.owned.push(cd.id);S.sel=cd.id;pop(`获得新陷阱：${TD[cd.id].name}`,W/2,CEIL+150,C.sun)}
    else if(cd.kind==='upg'){S.upg[cd.id]=1;const t=UPG[cd.id].trap;const add={spike_dur:2,pit_dur:2,portal_dur:3,ceil_dur:3}[cd.id]||0;if(add)for(const q of S.traps)if(q.type===t&&!q.done)q.uses+=add;pop(`强化：${UPG[cd.id].name}`,W/2,CEIL+150,C.sun)}
    else{if(cd.id==='gold')S.gold+=40;else if(cd.id==='life')S.lives++;else S.cap+=2;pop(GEN[cd.id].name,W/2,CEIL+150,C.sun)}
    const now=Object.keys(SCH).filter(active).filter(s=>!before.includes(s));
    if(now.length){const s=SCH[now[0]];S.announce={text:`流派成型：${s.name} · ${s.bonus}`,t:5,col:s.col};
      if(now[0]==='spike')for(const q of S.traps)if(TD[q.type].sch==='spike'&&!q.done)q.uses++;
      if(now[0]==='fall')for(const q of S.traps)if((q.type==='ice'||q.type==='portal')&&!q.done)q.uses+=2;}
    S.draft=null;S.phase='break';S.breakT=7;
  }
  function draftClick(x,y){
    for(let i=0;i<S.draft.length;i++)if(inR(x,y,CARD(i))){pickCard(S.draft[i]);return}
    if(inR(x,y,RER)){const c=rerollCost();if(S.gold<c){flash(`金币不够，换一批要 ${c}`);return}S.gold-=c;S.rerolls++;S.draft=makeDraft()}
  }

      if(sel){c.strokeStyle=C.sun;c.lineWidth=3;c.stroke()}
      c.globalAlpha=can?1:0.35;
      icon(c,k,r.x+22,r.y+r.h/2,0.75);txt(c,TD[k].name,r.x+42,r.y+(CMP?21:17),r.w>130?(CMP?19:17):15,C.fg,'left',700);txt(c,`${costOf(k)} 金币`,r.x+42,r.y+(CMP?43:36),CMP?15:13,C.sun,'left',700);
      c.globalAlpha=1;
    }
    // messages
    if(S.phase==='break'&&!S.over){
      pill(c,`下一波：${summary(S.preview)}`,W/2,CEIL+30,15,'rgba(20,28,43,0.9)',C.fg);
      pill(c,`${Math.ceil(S.breakT)} 秒后出发 · 按空格立刻出发`,W/2,CEIL+66,13,'rgba(20,28,43,0.9)',C.muted);
      if(S.wave===0)pill(c,`选下面的陷阱，点地面放置 · 每守住一波可以抽卡 · 已解锁 ${ALL.filter(k=>M.unlocked[k]).length}/${ALL.length} 种陷阱`,W/2,CEIL+230,14,'rgba(20,28,43,0.9)',C.fg);
    }
    if(S.announce)pill(c,S.announce.text,W/2,CEIL+30,15,S.announce.col||C.sky,C.deep);
    if(S.unlock)pill(c,S.unlock.text,W/2,CEIL+160,17,C.sun,C.deep);
    if(S.msgT>0)pill(c,S.msg,W/2,CEIL+196,15,C.coral,C.fg);
    if(S.phase!=='draft')drawPops(c,S);
    if(S.phase==='draft'&&!S.over&&S.draft){
      c.fillStyle='rgba(12,17,28,0.88)';c.fillRect(0,CEIL,W,BAR-CEIL);
      txt(c,`守住第 ${S.wave} 波！选一张卡`,W/2,CEIL+20,18,C.fg,'center',800);
      S.draft.forEach((cd,i)=>drawCard(c,cd,CARD(i)));
      const can=S.gold>=rerollCost();rr(c,RER.x,RER.y,RER.w,RER.h,10);c.fillStyle=can?C.surface2:C.surface;c.fill();
      txt(c,`换一批（${rerollCost()} 金币）`,W/2,RER.y+RER.h/2,15,can?C.fg:C.muted,'center',700);
      if(S.unlock)pill(c,S.unlock.text,W/2,CEIL+160,17,C.sun,C.deep);
    }
    if(S.over){
      c.fillStyle='rgba(12,17,28,0.9)';c.fillRect(0,0,W,H);
      const y0=CMP?36:70;
      txt(c,'地牢失守',W/2,y0,CMP?34:42,C.fg,'center',800);
      txt(c,`守住了 ${Math.max(0,S.wave-1)} 波，坑死 ${S.kills} 名勇者 · 最好成绩 ${getBest('trap3')} 波`,W/2,y0+(CMP?36:48),CMP?16:18,C.muted,'center',600);
      const locked=GOALS.filter(gl=>!M.unlocked[gl.id]);
      txt(c,`陷阱解锁进度 ${ALL.filter(k=>M.unlocked[k]).length}/${ALL.length}`,W/2,y0+(CMP?70:100),17,C.sun,'center',800);
      const ly=y0+(CMP?104:136),lstep=CMP?32:40,rh=CMP?28:32;
      if(!locked.length)txt(c,'全部陷阱都解锁了！',W/2,ly,17,C.fg,'center',700);
      locked.slice(0,CMP?5:6).forEach((gl,i)=>{const[a,b]=gl.p(),y=ly+i*lstep;rr(c,W/2-270,y-rh/2,540,rh,8);c.fillStyle=C.surface;c.fill();icon(c,gl.id,W/2-246,y,0.7);
        txt(c,`${TD[gl.id].name}：${gl.text}`,W/2-222,y,15,C.fg,'left',600);txt(c,`${Math.min(a,b)}/${b}`,W/2+256,y,15,C.sun,'right',800)});
      if(!S.revived){rr(c,BTN_REV.x,BTN_REV.y,BTN_REV.w,BTN_REV.h,12);c.fillStyle=C.mint;c.fill();txt(c,'复活继续（+2 条命，测试版不放广告）',BTN_REV.x+BTN_REV.w/2,BTN_REV.y+BTN_REV.h/2,16,C.deep,'center',800)}
      const rb=S.revived?{x:W/2-100,y:H-76,w:200,h:52}:BTN_RE;rr(c,rb.x,rb.y,rb.w,rb.h,12);c.fillStyle=C.surface2;c.fill();txt(c,'重新开始',rb.x+rb.w/2,rb.y+rb.h/2,16,C.fg,'center',700);
    }
    c.restore();
  };
  return g;
}

/* ===== Poki SDK 接入 ===== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let game=null;
const sdk=()=>window.PokiSDK||null;
let playing=false,adPlaying=false,last=0;
function gpStart(){if(playing)return;playing=true;try{sdk()&&sdk().gameplayStart()}catch(e){}}
function gpStop(){if(!playing)return;playing=false;try{sdk()&&sdk().gameplayStop()}catch(e){}}
function muteAudio(){/* 目前没有声音；加音效后在这里静音 */}
function unmuteAudio(){}
function commercial(){
  gpStop();adPlaying=true;
  let p;try{p=sdk()?sdk().commercialBreak(muteAudio):Promise.resolve()}catch(e){p=Promise.resolve()}
  return Promise.resolve(p).catch(()=>{}).then(()=>{unmuteAudio();adPlaying=false});
}
function rewarded(){
  gpStop();adPlaying=true;
  let p;try{p=sdk()?sdk().rewardedBreak(muteAudio):Promise.resolve(true)}catch(e){p=Promise.resolve(false)}
  return Promise.resolve(p).catch(()=>false).then(ok=>{unmuteAudio();adPlaying=false;return !!ok});
}
HOOK.over=()=>gpStop();
HOOK.restart=()=>{commercial().then(()=>{game.reset();gpStart()})};
HOOK.revive=()=>{rewarded().then(ok=>{if(ok){game.revive();gpStart()}else game.flash('广告没有播完，不能复活')})};

function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
function avail(){const w=document.getElementById('wrap');const cs=getComputedStyle(w);return{aw:w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah:w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)}}
function wantH(){const a=avail();if(!a.aw||!a.ah||a.ah>a.aw)return H;return Math.round(clamp(W*a.ah/a.aw,420,600))}
function fit(){const a=avail();if(!a.aw||!a.ah)return;const sc=Math.min(a.aw/W,a.ah/H);cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';resize()}
function layout(force){const nh=wantH();if(!game||(Math.abs(nh-H)>8&&(force||game.fresh()))){H=nh;game=TrapGame();game.reset()}fit()}
window.addEventListener('resize',()=>layout(false));
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(adPlaying||!game)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pt(e);game.move(p.x,p.y);const wasOver=game.isOver&&game.isOver();game.down(p.x,p.y);if(!wasOver)gpStart()});
cv.addEventListener('pointermove',e=>{if(adPlaying||!game)return;const p=pt(e);game.move(p.x,p.y)});
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(adPlaying||!game)return;
  if((e.code==='Space'||e.code==='Enter')&&!game.isOver()){gpStart();game.skip()}
});
window.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(!adPlaying)game.update(dt);
  if(cv.width){ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);game.draw(ctx)}
  requestAnimationFrame(frame);
}
let booted=false;
function boot(){if(booted)return;booted=true;layout(true);requestAnimationFrame(frame);try{sdk()&&sdk().gameLoadingFinished()}catch(e){}}
if(sdk()){try{sdk().init().then(boot).catch(boot)}catch(e){boot()}}else boot();
})();
</script>
