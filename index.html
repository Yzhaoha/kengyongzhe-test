function fitTxt(c,s,x,y,size,maxW,col,align,weight){let sz=size;c.font=`${weight||700} ${sz}px ${FONT}`;while(sz>9&&c.measureText(s).width>maxW){sz--;c.font=`${weight||700} ${sz}px ${FONT}`}txt(c,s,x,y,sz,col,align,weight)}
function pill(c,s,x,y,size,bg,fg){c.font=`700 ${size}px ${FONT}`;while(size>10&&c.measureText(s).width>W-40){size--;c.font=`700 ${size}px ${FONT}`}const w=c.measureText(s).width+24;rr(c,x-w/2,y-size,w,size*2,size);c.fillStyle=bg;c.fill();txt(c,s,x,y,size,fg)}
function bubble(c,s,x,y){c.font=`700 15px ${FONT}`;const w=c.measureText(s).width+20;const bx=clamp(x-w/2,6,W-w-6);const ty=Math.max(y,40);rr(c,bx,ty-32,w,28,8);c.fillStyle=C.fg;c.fill();const tx=clamp(x,bx+12,bx+w-12);c.beginPath();c.moveTo(tx-6,ty-5);c.lineTo(tx+6,ty-5);c.lineTo(tx,ty+3);c.closePath();c.fill();txt(c,s,bx+w/2,ty-18,15,C.bg)}
function overlay(c,title,lines){c.fillStyle='rgba(12,17,28,0.8)';c.fillRect(0,0,W,H);txt(c,title,W/2,H/2-70,46,C.fg,'center',800);lines.forEach((l,i)=>txt(c,l,W/2,H/2-10+i*36,i===lines.length-1?18:22,i===lines.length-1?C.sun:C.muted,'center',i===lines.length-1?700:600))}
function makeFX(){return{parts:[],shake:0,
  burst(x,y,col,n,sp){n=n||12;sp=sp||200;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=sp*(0.3+Math.random()*0.8);this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:0.5+Math.random()*0.4,col,sz:3+Math.random()*4})}},
  update(dt){this.shake=Math.max(0,this.shake-dt*30);for(const p of this.parts){p.life-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}this.parts=this.parts.filter(p=>p.life>0)},
  draw(c){for(const p of this.parts){c.globalAlpha=clamp(p.life*2,0,1);c.fillStyle=p.col;c.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz)}c.globalAlpha=1},
  apply(c){if(this.shake>0)c.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake)}}}
function stepPops(S,dt){for(const p of S.pops){p.life-=dt;p.y-=28*dt}S.pops=S.pops.filter(p=>p.life>0);if(S.msgT>0)S.msgT-=dt}
function drawPops(c,S){for(const p of S.pops){c.globalAlpha=clamp(p.life,0,1);txt(c,p.s,p.x,p.y,18,p.col,'center',800)}c.globalAlpha=1}

/* best scores: localStorage when allowed, memory otherwise */
const memBest={};
function getBest(k){let v=0;try{v=Number(localStorage.getItem('proto3_best_'+k))||0}catch(e){}return Math.max(v,memBest[k]||0)}
function saveBest(k,v){if(v>getBest(k)){memBest[k]=v;try{localStorage.setItem('proto3_best_'+k,String(v))}catch(e){}}updateBest()}

    }
    if(S.announce)pill(c,S.announce.text,W/2,CEIL+30,15,S.announce.col||C.sky,C.deep);
    if(S.unlock)pill(c,S.unlock.text,W/2,CEIL+160,17,C.sun,C.deep);
    if(S.msgT>0)pill(c,S.msg,W/2,CEIL+196,15,C.coral,C.fg);
    if(S.phase!=='draft')drawPops(c,S);
    if(S.phase==='draft'&&!S.over&&S.draft){
      c.fillStyle='rgba(12,17,28,0.88)';c.fillRect(0,CEIL,W,BAR-CEIL);
      txt(c,T('pickCard',{n:S.wave}),W/2,CEIL+20,18,C.fg,'center',800);
      S.draft.forEach((cd,i)=>drawCard(c,cd,CARD(i)));
      const can=S.gold>=rerollCost();rr(c,RER.x,RER.y,RER.w,RER.h,10);c.fillStyle=can?C.surface2:C.surface;c.fill();
      txt(c,T('reroll',{n:rerollCost()}),W/2,RER.y+RER.h/2,15,can?C.fg:C.muted,'center',700);
      if(S.unlock)pill(c,S.unlock.text,W/2,CEIL+160,17,C.sun,C.deep);
    }
    if(S.over){
      c.fillStyle='rgba(12,17,28,0.9)';c.fillRect(0,0,W,H);
      const y0=CMP?36:70;
      txt(c,T('lost'),W/2,y0,CMP?34:42,C.fg,'center',800);
      txt(c,T('lostStats',{w:Math.max(0,S.wave-1),k:S.kills,b:getBest('trap3')}),W/2,y0+(CMP?36:48),CMP?16:18,C.muted,'center',600);
      const locked=GOALS.filter(gl=>!M.unlocked[gl.id]);
      txt(c,T('unlockProg',{a:ALL.filter(k=>M.unlocked[k]).length,b:ALL.length}),W/2,y0+(CMP?70:100),17,C.sun,'center',800);
      const ly=y0+(CMP?104:136),lstep=CMP?32:40,rh=CMP?28:32;
      if(!locked.length)txt(c,T('allUnlocked'),W/2,ly,17,C.fg,'center',700);
      locked.slice(0,CMP?5:6).forEach((gl,i)=>{const[a,b]=gl.p(),y=ly+i*lstep;rr(c,W/2-270,y-rh/2,540,rh,8);c.fillStyle=C.surface;c.fill();icon(c,gl.id,W/2-246,y,0.7);
        fitTxt(c,T('goalLine',{name:TD[gl.id].name,text:gl.text}),W/2-222,y,15,430,C.fg,'left',600);txt(c,`${Math.min(a,b)}/${b}`,W/2+256,y,15,C.sun,'right',800)});
      if(!S.revived){rr(c,BTN_REV.x,BTN_REV.y,BTN_REV.w,BTN_REV.h,12);c.fillStyle=C.mint;c.fill();fitTxt(c,T('reviveFree'),BTN_REV.x+BTN_REV.w/2,BTN_REV.y+BTN_REV.h/2,16,BTN_REV.w-24,C.deep,'center',800)}
      const rb=S.revived?{x:W/2-100,y:H-76,w:200,h:52}:BTN_RE;rr(c,rb.x,rb.y,rb.w,rb.h,12);c.fillStyle=C.surface2;c.fill();fitTxt(c,T('restart'),rb.x+rb.w/2,rb.y+rb.h/2,16,rb.w-24,C.fg,'center',700);
    }
    c.restore();
  };
  return g;
}

/* ===== Poki SDK 接入 ===== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let game=null;
function applyLang(){try{document.title=T('title');const r=document.querySelector('#rotate div');if(r)r.textContent=T('rotate');document.documentElement.lang=LANG}catch(e){}}window.__onLang=applyLang;applyLang();

const sdk=()=>window.PokiSDK||null;
let playing=false,adPlaying=false,last=0;
function gpStart(){if(playing)return;playing=true;try{sdk()&&sdk().gameplayStart()}catch(e){}}
function gpStop(){if(!playing)return;playing=false;try{sdk()&&sdk().gameplayStop()}catch(e){}}
function muteAudio(){SFX.setAdMute(true)}
function unmuteAudio(){SFX.setAdMute(false)}
function commercial(){
  gpStop();adPlaying=true;
  let p;try{p=sdk()?sdk().commercialBreak(muteAudio):Promise.resolve()}catch(e){p=Promise.resolve()}
  return Promise.resolve(p).catch(()=>{}).then(()=>{unmuteAudio();adPlaying=false});
}
function rewarded(){
  gpStop();adPlaying=true;
  let p;try{p=sdk()?sdk().rewardedBreak(muteAudio):Promise.resolve(true)}catch(e){p=Promise.resolve(false)}
  return Promise.resolve(p).catch(()=>false).then(ok=>{unmuteAudio();adPlaying=false;return !!ok});
}
HOOK.over=()=>gpStop();
HOOK.restart=()=>{commercial().then(()=>{game.reset();gpStart()})};
HOOK.revive=()=>{rewarded().then(ok=>{if(ok){game.revive();gpStart()}else game.flash(T('adFail'))})};

function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
function avail(){const w=document.getElementById('wrap');const cs=getComputedStyle(w);return{aw:w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah:w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)}}
function wantH(){const a=avail();if(!a.aw||!a.ah||a.ah>a.aw)return H;return Math.round(clamp(W*a.ah/a.aw,420,600))}
function fit(){const a=avail();if(!a.aw||!a.ah)return;const sc=Math.min(a.aw/W,a.ah/H);cv.style.width=Math.floor(W*sc)+'px';cv.style.height=Math.floor(H*sc)+'px';resize()}
function layout(force){const nh=wantH();if(!game||(Math.abs(nh-H)>8&&(force||game.fresh()))){H=nh;game=TrapGame();game.reset()}fit()}
window.addEventListener('resize',()=>layout(false));
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(adPlaying||!game)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pt(e);game.move(p.x,p.y);const wasOver=game.isOver&&game.isOver();game.down(p.x,p.y);if(!wasOver)gpStart()});
cv.addEventListener('pointermove',e=>{if(adPlaying||!game)return;const p=pt(e);game.move(p.x,p.y)});
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(adPlaying||!game)return;
  if((e.code==='Space'||e.code==='Enter')&&!game.isOver()){gpStart();game.skip()}
});
window.addEventListener('wheel',e=>e.preventDefault(),{passive:false});
window.addEventListener('contextmenu',e=>e.preventDefault());
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(!adPlaying)game.update(dt);
  if(cv.width){ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);game.draw(ctx)}
  requestAnimationFrame(frame);
}
let booted=false;
function boot(){if(booted)return;booted=true;layout(true);requestAnimationFrame(frame);try{sdk()&&sdk().gameLoadingFinished()}catch(e){}}
if(sdk()){try{sdk().init().then(boot).catch(boot)}catch(e){boot()}}else boot();
})();
</script>
